{% extends "base.html" %}

{% block title %}Редактирование канала - YouTube Clone{% endblock %}

{% block content %}
<div class="edit-channel-page">
    <h1>Редактирование канала</h1>
    
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    
    <form action="/channel/edit/{{ channel.id }}" method="POST" class="channel-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <div class="form-group">
            <label for="name">Название канала *</label>
            <input type="text" id="name" name="name" required 
                   value="{{ channel.name }}" maxlength="100" autofocus>
            <small>Минимум 2 символа</small>
        </div>
        
        <div class="form-group">
            <label for="description">Описание</label>
            <textarea id="description" name="description" rows="4" 
                      maxlength="5000">{{ channel.description or '' }}</textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="/channel/{{ channel.id }}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
