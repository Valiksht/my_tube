{% extends "base.html" %}

{% block title %}Создание канала - YouTube Clone{% endblock %}

{% block content %}
<div class="create-channel-page">
    <h1>Создание канала</h1>
    
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    
    {% if success %}
    <div class="alert alert-success">{{ success }}</div>
    {% endif %}
    
    <form action="/channel/create" method="POST" class="channel-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <div class="form-group">
            <label for="name">Название канала *</label>
            <input type="text" id="name" name="name" required 
                   placeholder="Введите название канала" maxlength="100" autofocus>
            <small>Минимум 2 символа</small>
        </div>
        
        <div class="form-group">
            <label for="description">Описание</label>
            <textarea id="description" name="description" rows="4" 
                      placeholder="Расскажите о вашем канале" maxlength="5000"></textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Создать канал</button>
            <a href="/" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
