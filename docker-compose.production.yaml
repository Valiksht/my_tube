# ========================================
# YouTube Clone - Production Docker Compose
# ========================================
# Запускает полный стек приложения:
# - PostgreSQL (база данных)
# - MinIO (объектное хранилище)
# - FastAPI (backend API + HTML)
# - Nginx (reverse proxy + static files)
#
# MinIO образ: dockerhub.timeweb.cloud/bitnamilegacy/minio:latest
# ========================================

services:
  # ==========================================
  # PostgreSQL - основная база данных
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: mytube_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-mytube_db}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mytube_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mytube_network
    restart: unless-stopped

  # ==========================================
  # MinIO - объектное хранилище
  # ==========================================
  minio:
    image: dockerhub.timeweb.cloud/bitnamilegacy/minio:latest
    container_name: mytube_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BROWSER: "on"
      MINIO_SCHEME: http
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
      MINIO_DATA_DIR: /bitnami/minio/data
      MINIO_DEFAULT_BUCKETS: videos
      MINIO_STARTUP_TIMEOUT: "60"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - mytube_network
    restart: unless-stopped

  # ==========================================
  # MinIO Init - инициализация бакета
  # ==========================================
  minio-init:
    image: dockerhub.timeweb.cloud/bitnamilegacy/minio-client:latest
    container_name: mytube_minio_init
    environment:
      MINIO_SERVER_HOST: minio
      MINIO_SERVER_PORT_NUMBER: "9000"
      MINIO_SERVER_SCHEME: http
      MINIO_SERVER_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SERVER_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      minio:
        condition: service_healthy
    command:
      - /opt/bitnami/scripts/minio-client/run.sh
      - mb
      - --ignore-existing
      - minio/videos
    networks:
      - mytube_network
    restart: "no"

  # ==========================================
  # API - FastAPI приложение
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: mytube_api
    environment:
      - DEBUG=False
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-mytube_db}
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mytube_db}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production-12345}
      - CSRF_SECRET_KEY=${CSRF_SECRET_KEY:-change-this-csrf-secret-key-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - SESSION_COOKIE=session
      - SESSION_MAX_AGE=86400
      - SESSION_TOKEN_EXPIRE_DAYS=7
      # Storage: minio
      - STORAGE_TYPE=minio
      - STORAGE_DIR=/app/storage
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-videos}
      - MINIO_PUBLIC_URL=http://localhost:9000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - storage_data:/app/storage
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
      "
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - mytube_network
    restart: unless-stopped

  # ==========================================
  # Nginx - reverse proxy + static files
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: mytube_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - storage_data:/usr/share/nginx/storage:ro
    depends_on:
      - api
    networks:
      - mytube_network
    restart: unless-stopped

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  storage_data:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  mytube_network:
    driver: bridge
