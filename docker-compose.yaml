services:
  postgres:
    image: postgres:15-alpine
    container_name: mytube_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-mytube_db}
      - PGDATA=/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mytube_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mytube_network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mytube_api_local
    environment:
      - DEBUG=True
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-mytube_db}
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mytube_db}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production-12345}
      - CSRF_SECRET_KEY=${CSRF_SECRET_KEY:-change-this-csrf-secret-key-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:8000,http://localhost:8000,http://localhost:80}
      - SESSION_COOKIE=session
      - SESSION_MAX_AGE=86400
      - SESSION_TOKEN_EXPIRE_DAYS=7
      - STORAGE_TYPE=filesystem
      - STORAGE_DIR=/app/storage
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mytube_network
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:

networks:
  mytube_network:
    driver: bridge
