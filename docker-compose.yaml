
services:
  postgres:
    image: postgres:16-alpine
    container_name: mytube_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mytube_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mytube_api
    environment:
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mytube_db}

      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mytube_db}

      SECRET_KEY: ${SECRET_KEY:-dev-only-change-this-key}
      CSRF_SECRET_KEY: ${CSRF_SECRET_KEY:-dev-only-change-this-csrf-key}

      STORAGE_TYPE: filesystem
      STORAGE_DIR: /app/storage
      STORAGE_BASE_URL: http://localhost:8000/storage

      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000

    ports:
      - "${API_PORT:-8000}:8000"

    volumes:
      - storage_data:/app/storage

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  storage_data:
